name: Scanner semanal 1Listão (PBJ)

on:
  schedule:
    # Toda sexta-feira às 21:10 UTC (18:10 em Brasília), após o fechamento dos EUA.
    - cron: "10 21 * * 5"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write          # necessário para o workflow salvar o CSV de volta no repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scanner
        run: python scan.py

      - name: Salvar resultados no repositório
        run: |
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add scan_results.csv relatorio.md history/ || true
          git commit -m "Scan automático $(date -u +%Y-%m-%d)" || echo "sem mudanças"
          git push || echo "nada a enviar"

      - name: Publicar como artefato (download pelo Actions)
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan_results.csv
            relatorio.md
