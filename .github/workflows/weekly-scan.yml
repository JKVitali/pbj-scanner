name: Scanner semanal 1Listão (PBJ)

on:
  schedule:
    # Toda sexta-feira às 21:10 UTC (18:10 em Brasília), após o fechamento dos EUA.
    - cron: "10 21 * * 5"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

concurrency:
  group: pbj-git-push
  cancel-in-progress: false

permissions:
  contents: write          # necessário para o workflow salvar o CSV de volta no repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scanner
        run: python scan.py

      - name: Salvar resultados no repositório
        run: |
          set -euo pipefail
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add -A scan_results.csv relatorio.md
          [ -d history ] && git add -A history/
          if git diff --cached --quiet; then
            echo "Sem mudanças reais quando deveria haver — falhando para investigar."
            exit 1
          fi
          git commit -m "Scan automático $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "push falhou (tentativa $i), re-sincronizando..."; sleep 5
          done
          git push

      - name: Publicar como artefato (download pelo Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan_results.csv
            relatorio.md
