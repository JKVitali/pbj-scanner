name: Indicadores cripto BTC ETH SOL LINK SKY (PBJ)

on:
  schedule:
    # Todos os dias as 20:55 UTC (17:55 em Brasilia); cripto negocia 24h
    - cron: "55 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: pbj-git-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cripto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Baixar indicadores (ETH, SOL, LINK, SKY, derivativos)
        run: |
          python btc_indicadores.py
          python cripto_indicadores.py
          python cripto_resumo.py
      - name: Salvar no repositorio
        run: |
          set -euo pipefail
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add -A data/btc data/cripto data/cripto_resumo.csv
          if git diff --cached --quiet; then
            echo "Sem mudanças reais quando deveria haver — falhando para investigar."
            exit 1
          fi
          git commit -m "Indicadores cripto $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "push falhou (tentativa $i), re-sincronizando..."; sleep 5
          done
          git push
