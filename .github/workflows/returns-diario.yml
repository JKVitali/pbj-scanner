name: Retornos diarios (PBJ)

on:
  schedule:
    # Dias uteis as 20:45 UTC (17:45 em Brasilia), depois do Hurst e antes da rotina das 18:44
    - cron: "45 20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: pbj-git-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  returns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calcular retornos
        run: python ret_scan.py
      - name: Salvar no repositorio
        run: |
          set -euo pipefail
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add -A returns_results.csv
          [ -d history ] && git add -A history/
          if git diff --cached --quiet; then
            echo "Sem mudanças reais quando deveria haver — falhando para investigar."
            exit 1
          fi
          git commit -m "Retornos automaticos $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "push falhou (tentativa $i), re-sincronizando..."; sleep 5
          done
          git push
