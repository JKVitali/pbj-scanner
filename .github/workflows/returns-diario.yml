name: Retornos diarios (PBJ)

on:
  schedule:
    # Dias uteis as 20:45 UTC (17:45 em Brasilia), depois do Hurst e antes da rotina das 18:44
    - cron: "45 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  returns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calcular retornos
        run: python ret_scan.py
      - name: Salvar no repositorio
        run: |
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add returns_results.csv history/ || true
          git commit -m "Retornos automaticos $(date -u +%Y-%m-%d)" || echo "sem mudancas"
          git pull --rebase || true
          git push || echo "nada a enviar"
