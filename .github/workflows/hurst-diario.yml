name: Hurst diario (PBJ)

on:
  schedule:
    # Dias uteis as 20:30 UTC (17:30 em Brasilia), antes da rotina das 18:44
    - cron: "30 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hurst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Calcular Hurst
        run: python hurst_scan.py
      - name: Salvar no repositorio
        run: |
          git config user.name  "pbj-scanner-bot"
          git config user.email "actions@github.com"
          git add hurst_results.csv || true
          git commit -m "Hurst automatico $(date -u +%Y-%m-%d)" || echo "sem mudancas"
          git pull --rebase || true
          git push || echo "nada a enviar"
